name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push to gh-pages
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          # '1' tracks the latest stable release. Project.toml declares 1.10 as the
          # floor; CairoMakie's recent versions want newer, so build docs on stable.
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'

      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CairoMakie renders headless; make that explicit for CI
          DATADEPS_ALWAYS_ACCEPT: 'true'
        run: julia --project=docs docs/make.jl
